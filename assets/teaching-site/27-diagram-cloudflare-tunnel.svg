<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <!-- Cloudflare Tunnel 連線示意：外部使用者 → Cloudflare 邊緣 ← cloudflared（由內往外連） → 本機服務 -->
  <rect width="960" height="420" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Cloudflare Tunnel：不開防火牆、不設路由器，也能讓外部連進本機</text>
  <!-- 外部使用者 -->
  <rect x="30" y="150" width="170" height="110" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="115" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#0c4a6e">外部使用者</text>
  <text x="115" y="225" text-anchor="middle" font-size="14" fill="#0c4a6e">瀏覽器 / 手機</text>
  <!-- Cloudflare 邊緣 -->
  <rect x="290" y="130" width="220" height="150" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="400" y="175" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">Cloudflare 邊緣網路</text>
  <text x="400" y="205" text-anchor="middle" font-size="13" fill="#9a3412">xxx.trycloudflare.com（免註冊）</text>
  <text x="400" y="230" text-anchor="middle" font-size="13" fill="#9a3412">shop.你的網域.com（需註冊）</text>
  <text x="400" y="258" text-anchor="middle" font-size="13" fill="#9a3412">自動 HTTPS</text>
  <!-- 你的電腦（Docker） -->
  <rect x="600" y="90" width="330" height="250" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="765" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">你的電腦（docker compose，需保持開機）</text>
  <rect x="625" y="145" width="130" height="70" rx="10" fill="#fff" stroke="#059669"/>
  <text x="690" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">cloudflared</text>
  <rect x="780" y="145" width="130" height="70" rx="10" fill="#fff" stroke="#059669"/>
  <text x="845" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">nginx :80</text>
  <text x="845" y="200" text-anchor="middle" font-size="12" fill="#065f46">前端 + /api</text>
  <rect x="780" y="245" width="130" height="70" rx="10" fill="#fff" stroke="#059669"/>
  <text x="845" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Spring Boot</text>
  <text x="845" y="300" text-anchor="middle" font-size="12" fill="#065f46">:8080</text>
  <!-- 箭頭 -->
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <line x1="200" y1="205" x2="288" y2="205" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="623" y1="180" x2="512" y2="180" stroke="#059669" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="567" y="168" text-anchor="middle" font-size="12" fill="#065f46">由內往外連線</text>
  <line x1="755" y1="180" x2="778" y2="180" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="845" y1="215" x2="845" y2="243" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="480" y="385" text-anchor="middle" font-size="14" fill="#475569">cloudflared 主動連出到 Cloudflare，所以家用網路、公司 NAT 後面都能用；電腦關機，網址就連不到。</text>
</svg>
