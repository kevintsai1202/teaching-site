<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-blu" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#f8fafc" rx="12"/>
  <text x="400" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">一次性回應 vs SSE 串流輸出</text>
  <text x="400" y="42" text-anchor="middle" font-size="11" fill="#64748b">同樣等模型生成 500 字，使用者的「體感等待」完全不同</text>

  <!-- ════════ LEFT: blocking ════════ -->
  <rect x="16" y="56" width="376" height="328" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="16" y="56" width="376" height="34" rx="8" fill="#dc2626"/>
  <rect x="16" y="76" width="376" height="14" fill="#dc2626"/>
  <text x="204" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="white">傳統一次性回應（.call()）</text>

  <text x="44" y="116" font-size="11" font-weight="700" fill="#0f172a">使用者</text>
  <text x="330" y="116" font-size="11" font-weight="700" fill="#0f172a">模型</text>
  <line x1="58" y1="124" x2="58" y2="350" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="344" y1="124" x2="344" y2="350" stroke="#cbd5e1" stroke-width="1.5"/>

  <line x1="58" y1="138" x2="344" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="201" y="132" text-anchor="middle" font-size="10" fill="#475569">提問</text>

  <!-- waiting zone -->
  <rect x="74" y="150" width="254" height="150" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-dasharray="5,4"/>
  <text x="201" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">⏳ 空白畫面等待 8 秒</text>
  <text x="201" y="220" text-anchor="middle" font-size="10" fill="#b91c1c">模型生成完 500 字才回傳</text>
  <text x="201" y="238" text-anchor="middle" font-size="10" fill="#b91c1c">使用者以為「當掉了」</text>

  <line x1="344" y1="316" x2="58" y2="316" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="201" y="310" text-anchor="middle" font-size="10" fill="#475569">一次回傳整段 500 字</text>

  <text x="201" y="344" text-anchor="middle" font-size="10" fill="#94a3b8">首字出現時間：8 秒</text>

  <!-- ════════ RIGHT: SSE streaming ════════ -->
  <rect x="408" y="56" width="376" height="328" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="408" y="56" width="376" height="34" rx="8" fill="#2563eb"/>
  <rect x="408" y="76" width="376" height="14" fill="#2563eb"/>
  <text x="596" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="white">SSE 串流輸出（.stream()）</text>

  <text x="436" y="116" font-size="11" font-weight="700" fill="#0f172a">使用者</text>
  <text x="722" y="116" font-size="11" font-weight="700" fill="#0f172a">模型</text>
  <line x1="450" y1="124" x2="450" y2="350" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="736" y1="124" x2="736" y2="350" stroke="#cbd5e1" stroke-width="1.5"/>

  <line x1="450" y1="138" x2="736" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="593" y="132" text-anchor="middle" font-size="10" fill="#475569">提問（text/event-stream）</text>

  <!-- token pushes -->
  <line x1="736" y1="166" x2="450" y2="166" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blu)"/>
  <text x="593" y="160" text-anchor="middle" font-size="10" fill="#2563eb">「您好」</text>
  <line x1="736" y1="198" x2="450" y2="198" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blu)"/>
  <text x="593" y="192" text-anchor="middle" font-size="10" fill="#2563eb">「，無線耳機」</text>
  <line x1="736" y1="230" x2="450" y2="230" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blu)"/>
  <text x="593" y="224" text-anchor="middle" font-size="10" fill="#2563eb">「 Pro 目前」</text>
  <line x1="736" y1="262" x2="450" y2="262" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blu)"/>
  <text x="593" y="256" text-anchor="middle" font-size="10" fill="#2563eb">「庫存 120 件…」</text>

  <rect x="466" y="278" width="254" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="593" y="294" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="700">⌨️ 打字機效果：邊生成邊顯示</text>
  <text x="593" y="308" text-anchor="middle" font-size="10" fill="#1d4ed8">Flux&lt;String&gt; 逐段推播給瀏覽器</text>

  <text x="593" y="344" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="700">首字出現時間：0.5 秒 ✓</text>
</svg>
