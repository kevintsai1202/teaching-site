<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-grn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="800" height="380" fill="#f8fafc" rx="12"/>
  <text x="400" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">結構化 Log 與動態調整層級</text>
  <text x="400" y="42" text-anchor="middle" font-size="11" fill="#64748b">@Slf4j 寫 Log → application.yml 設定層級 → Actuator 動態調整，無需重啟</text>

  <!-- ══════════════════════════════════════════════
       LEFT: Log level filter pyramid
       ══════════════════════════════════════════════ -->
  <rect x="16" y="52" width="370" height="312" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="16" y="52" width="370" height="34" rx="8" fill="#0f172a"/>
  <rect x="16" y="72" width="370" height="14" fill="#0f172a"/>
  <text x="201" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="white">Log 層級過濾機制</text>

  <!-- Level bars (top = TRACE, bottom = ERROR) -->
  <!-- TRACE -->
  <rect x="26" y="98" width="350" height="34" rx="5" fill="#f1f5f9"/>
  <text x="106" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">TRACE</text>
  <text x="106" y="126" text-anchor="middle" font-size="10" fill="#94a3b8">最詳細，框架內部使用</text>
  <rect x="200" y="102" width="168" height="26" rx="4" fill="#e2e8f0"/>
  <text x="284" y="119" text-anchor="middle" font-size="10" fill="#94a3b8">被過濾（INFO 閾值以下）</text>

  <!-- DEBUG -->
  <rect x="26" y="138" width="350" height="34" rx="5" fill="#f1f5f9"/>
  <text x="106" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">DEBUG</text>
  <text x="106" y="166" text-anchor="middle" font-size="10" fill="#64748b">詳細執行資訊，開發除錯</text>
  <rect x="200" y="142" width="168" height="26" rx="4" fill="#e2e8f0"/>
  <text x="284" y="159" text-anchor="middle" font-size="10" fill="#64748b">被過濾（INFO 閾值以下）</text>

  <!-- Threshold line -->
  <line x1="26" y1="179" x2="370" y2="179" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="30" y="176" font-size="10" fill="#2563eb" font-weight="700">← 預設閾值（root: INFO）</text>

  <!-- INFO -->
  <rect x="26" y="184" width="350" height="34" rx="5" fill="#eff6ff"/>
  <text x="106" y="199" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">INFO</text>
  <text x="106" y="212" text-anchor="middle" font-size="10" fill="#1d4ed8">正常業務關鍵節點（預設）</text>
  <rect x="200" y="188" width="168" height="26" rx="4" fill="#2563eb"/>
  <text x="284" y="205" text-anchor="middle" font-size="10" fill="white" font-weight="700">✓ 寫入輸出</text>

  <!-- WARN -->
  <rect x="26" y="224" width="350" height="34" rx="5" fill="#fffbeb"/>
  <text x="106" y="239" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">WARN</text>
  <text x="106" y="252" text-anchor="middle" font-size="10" fill="#b45309">可自動恢復的異常情況</text>
  <rect x="200" y="228" width="168" height="26" rx="4" fill="#d97706"/>
  <text x="284" y="245" text-anchor="middle" font-size="10" fill="white" font-weight="700">✓ 寫入輸出</text>

  <!-- ERROR -->
  <rect x="26" y="264" width="350" height="34" rx="5" fill="#fef2f2"/>
  <text x="106" y="279" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">ERROR</text>
  <text x="106" y="292" text-anchor="middle" font-size="10" fill="#b91c1c">需人工介入，記錄 stack trace</text>
  <rect x="200" y="268" width="168" height="26" rx="4" fill="#dc2626"/>
  <text x="284" y="285" text-anchor="middle" font-size="10" fill="white" font-weight="700">✓ 寫入輸出</text>

  <!-- Caption -->
  <text x="201" y="318" text-anchor="middle" font-size="11" fill="#475569">設定 INFO → 只輸出 INFO + WARN + ERROR</text>
  <text x="201" y="334" text-anchor="middle" font-size="11" fill="#475569">設定 DEBUG → 四個層級全輸出（Hibernate SQL 可見）</text>
  <text x="201" y="350" text-anchor="middle" font-size="11" fill="#475569">設定 ERROR → 只有嚴重錯誤才輸出</text>

  <!-- ══════════════════════════════════════════════
       RIGHT: @Slf4j usage + Actuator
       ══════════════════════════════════════════════ -->

  <!-- @Slf4j code block -->
  <rect x="402" y="52" width="382" height="168" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="402" y="52" width="382" height="34" rx="8" fill="#0f172a"/>
  <rect x="402" y="72" width="382" height="14" fill="#0f172a"/>
  <text x="593" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="white">@Slf4j 使用方式</text>

  <rect x="412" y="94" width="362" height="118" rx="6" fill="#1e293b"/>
  <text x="422" y="110" font-size="9.5" fill="#c4b5fd" font-family="monospace">@Slf4j   // Lombok 自動注入 log 物件</text>
  <text x="422" y="124" font-size="9.5" fill="#86efac" font-family="monospace">@Service</text>
  <text x="422" y="138" font-size="9.5" fill="#e2e8f0" font-family="monospace">public class ProductService {</text>
  <text x="422" y="152" font-size="9.5" fill="#e2e8f0" font-family="monospace">  public void save(Product p) {</text>
  <text x="422" y="166" font-size="9.5" fill="#7dd3fc" font-family="monospace">    log.info("新增商品: name={}", p.getName());</text>
  <text x="422" y="180" font-size="9.5" fill="#fca5a5" font-family="monospace">    log.warn("庫存不足: id={}", p.getId());</text>
  <text x="422" y="194" font-size="9.5" fill="#f87171" font-family="monospace">    log.error("儲存失敗", ex); // 含 stack trace</text>

  <!-- Actuator section -->
  <rect x="402" y="234" width="382" height="130" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="402" y="234" width="382" height="34" rx="8" fill="#7c3aed"/>
  <rect x="402" y="254" width="382" height="14" fill="#7c3aed"/>
  <text x="593" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="white">Actuator 動態調整層級（無需重啟）</text>

  <!-- Actuator flow -->
  <rect x="412" y="275" width="170" height="78" rx="6" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="497" y="291" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">PATCH 請求</text>
  <text x="422" y="306" font-size="9" fill="#4c1d95" font-family="monospace">/actuator/loggers/</text>
  <text x="422" y="318" font-size="9" fill="#4c1d95" font-family="monospace">com.example.tutorial</text>
  <text x="422" y="332" font-size="9" fill="#4c1d95" font-family="monospace">{"configuredLevel":"DEBUG"}</text>
  <text x="422" y="346" font-size="9" fill="#7c3aed">→ 即時生效，不重啟</text>

  <line x1="584" y1="314" x2="600" y2="314" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="604" y="275" width="170" height="78" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="689" y="291" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">設定檔開放端點</text>
  <text x="614" y="306" font-size="9" fill="#166534" font-family="monospace">management:</text>
  <text x="614" y="318" font-size="9" fill="#166534" font-family="monospace">  endpoints.web</text>
  <text x="614" y="330" font-size="9" fill="#166534" font-family="monospace">    .exposure.include:</text>
  <text x="614" y="342" font-size="9" fill="#166534" font-family="monospace">    loggers,health</text>

  <!-- {} placeholder tip -->
  <rect x="402" y="374" width="382" height="0" rx="4" fill="transparent"/>
</svg>
