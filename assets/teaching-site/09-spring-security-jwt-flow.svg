<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <!-- 箭頭 -->
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-blu" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arr-grn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <!-- 陰影 -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#f8fafc" rx="12"/>
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Spring Security JWT 認證與授權流程圖</text>
  <text x="400" y="52" text-anchor="middle" font-size="11" fill="#64748b">請求到達 Controller 前，必須通過 Security Filter Chain 的身分驗證與角色權限檢查</text>

  <!-- ════════ CLIENT (左側) ════════ -->
  <rect x="24" y="160" width="130" height="150" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="24" y="160" width="130" height="30" rx="8" fill="#64748b"/>
  <rect x="24" y="175" width="130" height="15" fill="#64748b"/>
  <text x="89" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="white">客戶端 (Client)</text>
  
  <text x="36" y="215" font-size="10" fill="#0f172a" font-weight="700">HTTP Request</text>
  <text x="36" y="235" font-size="9" fill="#475569">POST /api/products</text>
  <rect x="34" y="248" width="110" height="46" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="40" y="262" font-size="8" fill="#475569" font-weight="700">Authorization Header:</text>
  <text x="40" y="274" font-size="8" fill="#1d4ed8">Bearer eyJhbGciOi...</text>
  <text x="40" y="286" font-size="8" fill="#64748b">（攜帶 JWT Token）</text>

  <!-- ════════ FILTER CHAIN (中間大外框) ════════ -->
  <rect x="200" y="80" width="410" height="346" rx="8" fill="white" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="405" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Spring Security Filter Chain (過濾器鏈)</text>

  <!-- 1. JwtAuthenticationFilter -->
  <rect x="220" y="126" width="166" height="190" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="220" y="126" width="166" height="24" rx="4" fill="#3b82f6"/>
  <text x="303" y="142" text-anchor="middle" font-size="10" font-weight="700" fill="white">1. JwtAuthenticationFilter</text>
  
  <text x="230" y="170" font-size="9" fill="#1e3a8a" font-weight="700">認證流程 (Authentication):</text>
  <text x="230" y="188" font-size="9" fill="#1d4ed8">• 擷取並解析 JWT</text>
  <text x="230" y="204" font-size="9" fill="#1d4ed8">• 驗證簽章與有效期限</text>
  
  <!-- 呼叫 UserDetailsService -->
  <path d="M 303,214 L 303,238" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blu)"/>
  
  <rect x="230" y="244" width="146" height="32" rx="4" fill="#f8fafc" stroke="#bfdbfe"/>
  <text x="303" y="256" text-anchor="middle" font-size="8" font-weight="700" fill="#1e3a8a">CustomUserDetailsService</text>
  <text x="303" y="268" text-anchor="middle" font-size="8" fill="#2563eb">載入 UserDetails (你是誰)</text>

  <!-- 2. SecurityContext -->
  <rect x="230" y="286" width="146" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="303" y="299" text-anchor="middle" font-size="8" font-weight="700" fill="#1e3a8a">綁定 SecurityContextHolder</text>

  <!-- 3. AuthorizationFilter -->
  <rect x="424" y="126" width="166" height="190" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="424" y="126" width="166" height="24" rx="4" fill="#dc2626"/>
  <text x="507" y="142" text-anchor="middle" font-size="10" font-weight="700" fill="white">2. AuthorizationFilter</text>
  
  <text x="434" y="170" font-size="9" fill="#7f1d1d" font-weight="700">授權流程 (Authorization):</text>
  <text x="434" y="188" font-size="9" fill="#b91c1c">• 從 SecurityContext</text>
  <text x="444" y="200" font-size="9" fill="#b91c1c">取得角色 (ROLE_USER/ADMIN)</text>
  <text x="434" y="218" font-size="9" fill="#b91c1c">• 比對 SecurityConfig 規則:</text>
  
  <rect x="434" y="230" width="146" height="42" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="507" y="242" text-anchor="middle" font-size="8" font-weight="700" fill="#7f1d1d">POST /api/products</text>
  <text x="507" y="254" text-anchor="middle" font-size="8" fill="#b91c1c" font-weight="700">-> 限制 ROLE_ADMIN 才能存取</text>

  <rect x="434" y="282" width="146" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="507" y="294" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">比對角色權限是否相符</text>

  <!-- ════════ CONTROLLER (右側) ════════ -->
  <rect x="650" y="160" width="126" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="650" y="160" width="126" height="30" rx="8" fill="#16a34a"/>
  <rect x="650" y="175" width="126" height="15" fill="#16a34a"/>
  <text x="713" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="white">控制器 (Controller)</text>
  <text x="713" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">ProductController</text>
  <text x="713" y="235" text-anchor="middle" font-size="8" fill="#16a34a">執行新增商品邏輯</text>
  <text x="713" y="255" text-anchor="middle" font-size="8" fill="#16a34a">寫入資料庫 &amp; 回傳</text>

  <!-- ════════ ARROWS & PATHS (連線箭頭) ════════ -->
  <!-- Client to JWT Filter -->
  <path d="M 154,221 L 212,221" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blu)"/>
  <text x="183" y="212" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="700">進入</text>

  <!-- JWT Filter to Auth Filter -->
  <path d="M 386,221 L 416,221" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="401" y="212" text-anchor="middle" font-size="8" fill="#475569">通過認證</text>

  <!-- Auth Filter: SUCCESS -> Controller -->
  <path d="M 590,221 L 642,221" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-grn)"/>
  <text x="616" y="212" text-anchor="middle" font-size="9" fill="#15803d" font-weight="700">放行 (201)</text>

  <!-- Controller to Client: Success Response -->
  <path d="M 713,280 L 713,380 L 89,380 L 89,318" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-grn)" stroke-dasharray="1,0"/>
  <text x="400" y="374" text-anchor="middle" font-size="9" fill="#15803d" font-weight="700">HTTP 201 Created (成功回傳新增商品)</text>

  <!-- Auth Filter: FAILURE (403 Forbidden) -> Client -->
  <path d="M 507,316 L 507,344 L 89,344 L 89,318" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="298" y="338" text-anchor="middle" font-size="9" fill="#b91c1c" font-weight="700">拒絕存取：HTTP 403 Forbidden (角色不符，例如 USER 存取寫入端點)</text>

  <!-- JWT Filter: FAILURE (401 Unauthorized) -> Client -->
  <path d="M 303,126 L 303,110 L 89,110 L 89,152" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="196" y="104" text-anchor="middle" font-size="9" fill="#b91c1c" font-weight="700">認證失敗：HTTP 401 Unauthorized (Token 損壞或過期)</text>

</svg>
