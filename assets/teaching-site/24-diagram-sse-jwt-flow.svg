<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif">
  <!-- 2-5 AI 客服串流與 JWT 認證流程：fetch + POST（Authorization 標頭、JSON 本文）+ ReadableStream 解析 SSE -->
  <defs>
    <marker id="arr-blu" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arr-grn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="#f8fafc" rx="12"/>
  <text x="400" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">fetch 串流 + JWT 認證流程</text>
  <text x="400" y="42" text-anchor="middle" font-size="11" fill="#64748b">fetch 可以自訂標頭：Token 放 Authorization 標頭、問題放 JSON 本文，網址不帶 Token 與問題</text>

  <!-- React 前端 -->
  <rect x="24" y="60" width="300" height="252" rx="10" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <rect x="24" y="60" width="300" height="32" rx="10" fill="#7c3aed"/>
  <rect x="24" y="80" width="300" height="12" fill="#7c3aed"/>
  <text x="174" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="white">React 前端（ChatRoom.jsx + sseClient.js）</text>

  <rect x="44" y="104" width="260" height="40" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="174" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">① localStorage 取出登入時存的 JWT</text>
  <text x="174" y="137" text-anchor="middle" font-size="9" fill="#8b5cf6">const token = localStorage.getItem('token')</text>

  <rect x="44" y="154" width="260" height="66" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="174" y="172" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">② fetch 送出 POST /api/ai/stream</text>
  <text x="174" y="188" text-anchor="middle" font-size="9" fill="#8b5cf6">Authorization: Bearer eyJh...</text>
  <text x="174" y="202" text-anchor="middle" font-size="9" fill="#8b5cf6">本文 {"message":"..."}、signal: AbortController</text>
  <text x="174" y="215" text-anchor="middle" font-size="9" fill="#16a34a">✓ 網址不含 Token 與問題</text>

  <rect x="44" y="230" width="260" height="72" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="174" y="247" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">⑤ 讀 response.body 自行解析 SSE</text>
  <text x="174" y="262" text-anchor="middle" font-size="9" fill="#3b82f6">getReader() + TextDecoder，依空行切事件</text>
  <text x="174" y="276" text-anchor="middle" font-size="9" fill="#3b82f6">取 data: 內容，收到 [DONE] 結束</text>
  <text x="174" y="291" text-anchor="middle" font-size="9" fill="#3b82f6">打字機效果；關閉視窗時 abort() 中止</text>

  <!-- Spring Boot 後端 -->
  <rect x="476" y="60" width="300" height="252" rx="10" fill="white" stroke="#2563eb" stroke-width="2"/>
  <rect x="476" y="60" width="300" height="32" rx="10" fill="#2563eb"/>
  <rect x="476" y="80" width="300" height="12" fill="#2563eb"/>
  <text x="626" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="white">Spring Boot 後端</text>

  <rect x="496" y="104" width="260" height="86" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="626" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">③ JwtAuthenticationFilter.parseJwt()</text>
  <text x="626" y="140" text-anchor="middle" font-size="9" fill="#3b82f6">只讀 Authorization: Bearer 標頭</text>
  <text x="626" y="156" text-anchor="middle" font-size="9" fill="#16a34a">驗證 JWT ✓ → 放進 SecurityContext</text>
  <text x="626" y="172" text-anchor="middle" font-size="9" fill="#94a3b8">（沿用 1-9 的過濾器，所有 API 規則相同）</text>

  <rect x="496" y="202" width="260" height="100" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="626" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">④ @PostMapping("/stream")</text>
  <text x="626" y="237" text-anchor="middle" font-size="9" fill="#16a34a">@RequestBody ChatRequest → message</text>
  <text x="626" y="253" text-anchor="middle" font-size="9" fill="#16a34a">ChatClient.stream() → Flux&lt;String&gt;</text>
  <text x="626" y="269" text-anchor="middle" font-size="9" fill="#16a34a">Content-Type: text/event-stream</text>
  <text x="626" y="285" text-anchor="middle" font-size="9" fill="#16a34a">結尾多送 data:[DONE]</text>

  <!-- 中間箭頭 -->
  <line x1="324" y1="186" x2="476" y2="146" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blu)"/>
  <text x="400" y="152" text-anchor="middle" font-size="10" fill="#1d4ed8">POST（標頭帶 Token）</text>
  <line x1="476" y1="262" x2="324" y2="262" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-grn)"/>
  <text x="400" y="254" text-anchor="middle" font-size="10" fill="#15803d">data: 字元片段（持續推播）</text>

  <!-- 下方比較 -->
  <rect x="24" y="332" width="368" height="100" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="208" y="356" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">SSE（本課程採用）</text>
  <text x="208" y="376" text-anchor="middle" font-size="10" fill="#475569">單向推送、基於標準 HTTP 的 text/event-stream</text>
  <text x="208" y="394" text-anchor="middle" font-size="10" fill="#475569">前端用 fetch 讀串流，約 40 行，不用第三方套件</text>
  <text x="208" y="414" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="700">✓ 最適合 AI 逐字生成的單向場景</text>

  <rect x="408" y="332" width="368" height="100" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="592" y="356" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">WebSockets</text>
  <text x="592" y="376" text-anchor="middle" font-size="10" fill="#475569">雙向通道、獨立協定、需自行處理重連</text>
  <text x="592" y="394" text-anchor="middle" font-size="10" fill="#475569">適合多人協作、即時遊戲等雙向場景</text>
  <text x="592" y="414" text-anchor="middle" font-size="10" fill="#b45309" font-weight="700">△ 對單向串流而言過重</text>
</svg>
