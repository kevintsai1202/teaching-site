<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" font-family="system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="510" fill="#f8fafc" rx="12"/>

  <!-- ═══════════════════════════════════════════════════════
       PART 1 ─ Cross-cutting Concerns Matrix
       ═══════════════════════════════════════════════════════ -->

  <text x="400" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">
    橫切關注點（Cross-cutting Concerns）
  </text>
  <text x="400" y="42" text-anchor="middle" font-size="11" fill="#64748b">
    相同邏輯散落在每個 Service，沒有 AOP 就得各自撰寫
  </text>

  <!-- Column headers -->
  <rect x="234" y="52" width="162" height="26" rx="5" fill="#2563eb"/>
  <text x="315" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="white">UserService</text>

  <rect x="406" y="52" width="162" height="26" rx="5" fill="#2563eb"/>
  <text x="487" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="white">ProductService</text>

  <rect x="578" y="52" width="162" height="26" rx="5" fill="#2563eb"/>
  <text x="659" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="white">OrderService</text>

  <!-- Row 1 ─ @Transactional -->
  <rect x="16" y="86" width="208" height="28" rx="4" fill="#fff7ed"/>
  <text x="21" y="105" font-size="12" font-weight="700" fill="#c2410c">@Transactional（交易）</text>

  <rect x="234" y="86" width="162" height="28" rx="4" fill="#fed7aa"/>
  <text x="315" y="104" text-anchor="middle" font-size="11" fill="#7c2d12">begin / commit</text>
  <rect x="406" y="86" width="162" height="28" rx="4" fill="#fed7aa"/>
  <text x="487" y="104" text-anchor="middle" font-size="11" fill="#7c2d12">begin / commit</text>
  <rect x="578" y="86" width="162" height="28" rx="4" fill="#fed7aa"/>
  <text x="659" y="104" text-anchor="middle" font-size="11" fill="#7c2d12">begin / commit</text>

  <!-- Row 2 ─ @Valid -->
  <rect x="16" y="120" width="208" height="28" rx="4" fill="#faf5ff"/>
  <text x="21" y="139" font-size="12" font-weight="700" fill="#6d28d9">@Valid（輸入驗證）</text>

  <rect x="234" y="120" width="162" height="28" rx="4" fill="#ede9fe"/>
  <text x="315" y="138" text-anchor="middle" font-size="11" fill="#4c1d95">輸入驗證攔截</text>
  <rect x="406" y="120" width="162" height="28" rx="4" fill="#ede9fe"/>
  <text x="487" y="138" text-anchor="middle" font-size="11" fill="#4c1d95">輸入驗證攔截</text>
  <rect x="578" y="120" width="162" height="28" rx="4" fill="#ede9fe"/>
  <text x="659" y="138" text-anchor="middle" font-size="11" fill="#4c1d95">輸入驗證攔截</text>

  <!-- Row 3 ─ Exception -->
  <rect x="16" y="154" width="208" height="28" rx="4" fill="#fef2f2"/>
  <text x="21" y="173" font-size="12" font-weight="700" fill="#b91c1c">@ControllerAdvice（例外）</text>

  <rect x="234" y="154" width="162" height="28" rx="4" fill="#fecaca"/>
  <text x="315" y="172" text-anchor="middle" font-size="11" fill="#7f1d1d">例外統一攔截</text>
  <rect x="406" y="154" width="162" height="28" rx="4" fill="#fecaca"/>
  <text x="487" y="172" text-anchor="middle" font-size="11" fill="#7f1d1d">例外統一攔截</text>
  <rect x="578" y="154" width="162" height="28" rx="4" fill="#fecaca"/>
  <text x="659" y="172" text-anchor="middle" font-size="11" fill="#7f1d1d">例外統一攔截</text>

  <!-- Row 4 ─ Business Logic (emphasized) -->
  <rect x="16" y="188" width="208" height="36" rx="4" fill="#f0fdf4"/>
  <text x="21" y="208" font-size="12" font-weight="700" fill="#15803d">業務邏輯（你只需寫這）</text>
  <text x="21" y="221" font-size="10" fill="#16a34a">AOP 把其他列全部包走 ✓</text>

  <rect x="234" y="188" width="162" height="36" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="315" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">saveUser()</text>
  <rect x="406" y="188" width="162" height="36" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="487" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">saveProduct()</text>
  <rect x="578" y="188" width="162" height="36" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="659" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">createOrder()</text>

  <text x="400" y="244" text-anchor="middle" font-size="11" fill="#64748b">
    AOP 把橘/紫/紅三列的橫切邏輯集中到 Aspect，每個 Service 只剩下綠色的業務邏輯
  </text>

  <!-- Divider -->
  <line x1="16" y1="254" x2="784" y2="254" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════
       PART 2 ─ Proxy Mechanism
       ═══════════════════════════════════════════════════════ -->

  <text x="400" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">
    Spring AOP 實作原理：執行期 Proxy 攔截
  </text>

  <!-- Controller (Caller) -->
  <rect x="16" y="288" width="104" height="52" rx="7" fill="#2563eb"/>
  <text x="68" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="white">Controller</text>
  <text x="68" y="327" text-anchor="middle" font-size="10" fill="#bfdbfe">呼叫 Service</text>

  <!-- Arrow: Controller → Proxy -->
  <line x1="120" y1="314" x2="158" y2="314" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Proxy outer box -->
  <rect x="163" y="275" width="466" height="78" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="396" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">
    Spring AOP Proxy（CGLIB / JDK Dynamic Proxy）
  </text>

  <!-- Before/Around -->
  <rect x="176" y="300" width="130" height="46" rx="5" fill="#fed7aa" stroke="#f97316" stroke-width="1"/>
  <text x="241" y="319" text-anchor="middle" font-size="10" font-weight="700" fill="#7c2d12">Before / Around ↓</text>
  <text x="241" y="333" text-anchor="middle" font-size="10" fill="#9a3412">• begin TX</text>
  <text x="241" y="345" text-anchor="middle" font-size="10" fill="#9a3412">• validate params</text>

  <!-- inner arrow 1 -->
  <line x1="307" y1="323" x2="328" y2="323" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Real method -->
  <rect x="333" y="300" width="130" height="46" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="398" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">真實方法</text>
  <text x="398" y="333" text-anchor="middle" font-size="10" fill="#166534">saveProduct()</text>
  <text x="398" y="345" text-anchor="middle" font-size="10" fill="#166534">業務邏輯</text>

  <!-- inner arrow 2 -->
  <line x1="464" y1="323" x2="485" y2="323" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- After/Around -->
  <rect x="490" y="300" width="130" height="46" rx="5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="555" y="319" text-anchor="middle" font-size="10" font-weight="700" fill="#4c1d95">After / Around ↑</text>
  <text x="555" y="333" text-anchor="middle" font-size="10" fill="#5b21b6">• commit / rollback</text>
  <text x="555" y="345" text-anchor="middle" font-size="10" fill="#5b21b6">• AfterThrowing</text>

  <!-- Arrow: Proxy → return -->
  <line x1="629" y1="314" x2="666" y2="314" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Controller (result) -->
  <rect x="670" y="288" width="114" height="52" rx="7" fill="#2563eb"/>
  <text x="727" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="white">Controller</text>
  <text x="727" y="327" text-anchor="middle" font-size="10" fill="#bfdbfe">接收結果</text>

  <!-- Proxy type note -->
  <text x="400" y="376" text-anchor="middle" font-size="11" fill="#475569">
    目標類別有介面 → JDK 動態 Proxy ／ 無介面（如 @Service class）→ CGLIB 子類別 Proxy
  </text>

  <!-- ═══════════════════════════════════════════════════════
       Warning: Self-call Trap
       ═══════════════════════════════════════════════════════ -->

  <rect x="16" y="390" width="768" height="102" rx="8" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="400" y="410" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">
    ⚠ 自呼叫陷阱 ─ 最常見的 @Transactional 失效原因
  </text>

  <!-- Wrong: self-call -->
  <rect x="28" y="420" width="340" height="62" rx="5" fill="white" stroke="#fca5a5" stroke-width="1"/>
  <text x="198" y="437" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">❌ 錯誤：類別內部自呼叫</text>
  <text x="198" y="452" text-anchor="middle" font-size="10" fill="#7f1d1d">this.save() 直接呼叫同類別的 save()</text>
  <text x="198" y="466" text-anchor="middle" font-size="10" fill="#7f1d1d">→ 呼叫真實物件，完全繞過 Proxy</text>
  <text x="198" y="480" text-anchor="middle" font-size="10" fill="#7f1d1d">→ @Transactional / @Validated 不生效</text>

  <!-- Correct: extract bean -->
  <rect x="380" y="420" width="392" height="62" rx="5" fill="white" stroke="#86efac" stroke-width="1"/>
  <text x="576" y="437" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">✅ 解法：讓呼叫路徑經過 Proxy</text>
  <text x="576" y="452" text-anchor="middle" font-size="10" fill="#14532d">解法 1：將 save() 抽到另一個 @Service Bean</text>
  <text x="576" y="466" text-anchor="middle" font-size="10" fill="#14532d">解法 2：@Autowired 注入自身（self-injection）</text>
  <text x="576" y="480" text-anchor="middle" font-size="10" fill="#14532d">→ 呼叫時經過 Proxy，AOP 正常生效</text>
</svg>
