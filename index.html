<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot 4 與 Spring AI 2.0 兩天實戰課程</title>
    <script src="./course-data.js"></script>
    <style>
        :root {
            --bg: oklch(98% 0.008 95);
            --surface: oklch(100% 0 0);
            --surface-2: oklch(96% 0.01 95);
            --surface-3: oklch(93% 0.012 95);
            --fg: oklch(23% 0.03 250);
            --muted: oklch(49% 0.018 250);
            --muted-2: oklch(67% 0.015 250);
            --border: oklch(89% 0.01 95);
            --border-strong: oklch(76% 0.018 250);
            --accent: oklch(49% 0.13 230);
            --accent-soft: color-mix(in oklab, var(--accent) 16%, transparent);
            --accent-deep: oklch(34% 0.09 230);
            --accent-2: oklch(72% 0.16 72);
            --accent-2-soft: color-mix(in oklab, var(--accent-2) 20%, white);
            --accent-2-deep: oklch(56% 0.15 72);
            --success: oklch(56% 0.14 150);
            --success-soft: color-mix(in oklab, var(--success) 18%, white);
            --warning: oklch(66% 0.16 70);
            --warning-soft: color-mix(in oklab, var(--warning) 18%, white);
            --danger: oklch(58% 0.18 25);
            --danger-soft: color-mix(in oklab, var(--danger) 16%, white);
            --code-bg: oklch(18% 0.018 250);
            --code-fg: oklch(95% 0.005 250);
            --shadow-lift:
                0 28px 60px -42px oklch(24% 0.03 250 / 0.55),
                0 12px 24px -18px oklch(24% 0.03 250 / 0.22);
            --r-sm: 12px;
            --r-md: 20px;
            --r-lg: 32px;
            --content-max: 1480px;
            --hero-max: 1720px;
            --sidebar-w: 248px;
            --font-main: "Aptos", "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
        }

        [data-theme="dark"] {
            --bg: oklch(18% 0.02 250);
            --surface: oklch(23% 0.018 250);
            --surface-2: oklch(27% 0.02 250);
            --surface-3: oklch(31% 0.02 250);
            --fg: oklch(96% 0.005 250);
            --muted: oklch(81% 0.01 250);
            --muted-2: oklch(68% 0.01 250);
            --border: oklch(31% 0.014 250);
            --border-strong: oklch(44% 0.02 250);
            --accent-soft: color-mix(in oklab, var(--accent) 26%, transparent);
            --accent-2-soft: color-mix(in oklab, var(--accent-2) 24%, transparent);
            --success-soft: color-mix(in oklab, var(--success) 22%, transparent);
            --code-bg: oklch(15% 0.016 250);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            color: var(--fg);
            background:
                radial-gradient(circle at top left, color-mix(in oklab, var(--accent-2) 22%, transparent), transparent 34%),
                radial-gradient(circle at top right, color-mix(in oklab, var(--accent) 16%, transparent), transparent 30%),
                linear-gradient(180deg, var(--bg), color-mix(in oklab, var(--bg) 90%, var(--surface)));
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
        }

        .shell {
            min-height: 100vh;
            margin-left: var(--sidebar-w);
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-w);
            height: 100vh;
            padding: 24px 16px;
            border-right: 1px solid var(--border);
            background: color-mix(in oklab, var(--surface) 82%, transparent);
            backdrop-filter: blur(18px) saturate(140%);
            overflow-y: auto;
            z-index: 100;
        }

        /* 選單關閉按鈕（在 sidebar 右上角） */
        .sidebar-close-btn {
            position: absolute;
            top: 14px;
            right: 12px;
            width: 28px;
            height: 28px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 160ms ease;
            z-index: 10;
            padding: 0;
        }

        .sidebar-close-btn:hover {
            background: var(--surface-3);
            color: var(--fg);
        }

        /* 恢復選單按鈕：固定在左上角，選單收折時才顯示 */
        .sidebar-restore-btn {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 200;
            padding: 6px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--fg);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .sidebar-restore-btn:hover {
            background: var(--surface-3);
        }

        /* 選單收起狀態 */
        body.sidebar-hidden .shell {
            margin-left: 0;
        }

        body.sidebar-hidden .sidebar {
            display: none;
        }

        body.sidebar-hidden .sidebar-restore-btn {
            display: block;
        }

        .brand small,
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--accent-2-soft);
            color: var(--accent-2-deep);
            font-weight: 700;
            letter-spacing: 0.03em;
            font-size: 0.9rem;
        }

        .brand h1 {
            margin: 14px 0 10px;
            font-size: 1.24rem;
            line-height: 1.25;
        }

        .brand p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .sidebar nav {
            display: grid;
            gap: 8px;
            margin-top: 22px;
        }

        .nav-link {
            display: block;
            padding: 11px 12px;
            border-radius: var(--r-md);
            border: 1px solid transparent;
            color: var(--muted);
            text-decoration: none;
            transition: 160ms ease;
        }

        .nav-link strong {
            display: block;
            color: var(--fg);
            margin-bottom: 4px;
        }

        .nav-link:hover,
        .nav-link.active {
            background: color-mix(in oklab, var(--surface-2) 84%, transparent);
            border-color: var(--border);
            color: var(--fg);
        }

        /* 可收折的 Day 群組 */
        .nav-group {
            border-radius: var(--r-md);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .nav-group-header {
            list-style: none;
            cursor: pointer;
            padding: 11px 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: color-mix(in oklab, var(--surface-2) 60%, transparent);
            transition: 160ms ease;
            position: relative;
            user-select: none;
        }

        .nav-group-header:hover {
            background: color-mix(in oklab, var(--surface-2) 84%, transparent);
        }

        .nav-group-header::after {
            content: '›';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-deep);
            transition: transform 160ms ease;
        }

        .nav-group[open] > .nav-group-header::after {
            transform: translateY(-50%) rotate(270deg);
        }

        .nav-group-header::-webkit-details-marker { display: none; }

        .nav-group-badge {
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--accent-deep);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .nav-group-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--fg);
            line-height: 1.3;
            padding-right: 20px;
        }

        .nav-group-body {
            padding: 4px 6px 8px;
            display: grid;
            gap: 2px;
        }

        .nav-chapter-link {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid transparent;
            text-decoration: none;
            color: var(--muted);
            font-size: 0.86rem;
            transition: 160ms ease;
        }

        .nav-chapter-link:hover,
        .nav-chapter-link.active {
            background: color-mix(in oklab, var(--surface-2) 84%, transparent);
            border-color: var(--border);
            color: var(--fg);
        }

        .nav-chapter-num {
            flex-shrink: 0;
            font-weight: 800;
            font-size: 0.76rem;
            color: var(--accent-deep);
            padding-top: 2px;
        }

        .nav-chapter-title { line-height: 1.3; }

        .sidebar-tools {
            display: grid;
            gap: 12px;
            margin-top: 24px;
        }

        .tool-button {
            display: block;
            width: 100%;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 12px 14px;
            background: var(--surface);
            color: var(--fg);
            font: inherit;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
            transition: 160ms ease;
        }

        .tool-button:hover {
            box-shadow: var(--shadow-lift);
            transform: translateY(-1px);
        }

        .main {
            padding: 0 0 40px;
        }

        .top-actions {
            position: fixed;
            top: 18px;
            right: 24px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-theme-toggle {
            border: 1px solid color-mix(in oklab, var(--border) 84%, transparent);
            border-radius: 999px;
            padding: 10px 16px;
            background: color-mix(in oklab, var(--surface) 82%, transparent);
            color: var(--fg);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-lift);
            backdrop-filter: blur(16px) saturate(140%);
            transition: 160ms ease;
        }

        .top-theme-toggle:hover {
            transform: translateY(-1px);
        }

        .content {
            width: min(100%, var(--content-max));
            margin: 0 auto;
            padding: 0 28px;
        }

        .hero-band {
            width: min(100%, var(--hero-max));
            margin: 0 auto;
            padding: 24px 28px 0;
        }

        .hero {
            position: relative;
            overflow: hidden;
            min-height: 88vh;
            border-radius: 0 0 36px 36px;
            box-shadow: var(--shadow-lift);
            background:
                linear-gradient(120deg, oklch(20% 0.03 248 / 0.82), oklch(38% 0.06 232 / 0.64)),
                linear-gradient(180deg, transparent, oklch(14% 0.02 248 / 0.42));
        }

        .hero-media {
            position: absolute;
            inset: 0;
        }

        .hero-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: luminosity;
            opacity: 0.42;
        }

        .hero-overlay {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) 360px;
            gap: 28px;
            align-items: end;
            min-height: 88vh;
            padding: 56px;
        }

        .hero-copy h2 {
            margin: 18px 0 18px;
            font-size: clamp(2.8rem, 5vw, 5.4rem);
            line-height: 0.96;
            letter-spacing: -0.05em;
            color: white;
        }

        .hero-copy p {
            max-width: 820px;
            margin: 0;
            color: oklch(96% 0.01 250 / 0.92);
            line-height: 1.9;
            font-size: 1.08rem;
        }

        .pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 28px;
        }

        .pill {
            padding: 10px 14px;
            border-radius: 999px;
            background: oklch(100% 0 0 / 0.12);
            border: 1px solid oklch(100% 0 0 / 0.18);
            color: white;
            font-size: 0.92rem;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 30px;
        }

        .primary-button,
        .secondary-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 0 22px;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            transition: 160ms ease;
        }

        .primary-button {
            background: white;
            color: var(--accent-deep);
        }

        .secondary-button {
            background: transparent;
            border: 1px solid oklch(100% 0 0 / 0.24);
            color: white;
        }

        .primary-button:hover,
        .secondary-button:hover {
            transform: translateY(-1px);
        }

        .hero-panel {
            padding: 22px;
            border-radius: var(--r-lg);
            background: oklch(100% 0 0 / 0.1);
            border: 1px solid oklch(100% 0 0 / 0.14);
            backdrop-filter: blur(18px) saturate(140%);
            color: white;
        }

        .hero-panel h3 {
            margin: 0 0 12px;
            font-size: 1.05rem;
        }

        .hero-panel ul {
            margin: 0;
            padding-left: 18px;
            line-height: 1.8;
        }

        .glass-card {
            background: color-mix(in oklab, var(--surface) 84%, transparent);
            border: 1px solid color-mix(in oklab, var(--border) 90%, transparent);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-lift);
            backdrop-filter: blur(14px) saturate(140%);
        }

        .section {
            margin-top: 32px;
            padding: 28px 30px;
        }

        .section-header h3 {
            margin: 0;
            font-size: 1.9rem;
        }

        .section-header p {
            margin: 10px 0 0;
            color: var(--muted);
            line-height: 1.8;
            max-width: 860px;
        }

        .stat-grid,
        .summary-grid,
        .faq-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        .stat-card,
        .summary-card,
        .faq-card {
            padding: 20px;
            border-radius: var(--r-md);
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .stat-card small,
        .summary-card small {
            display: block;
            margin-bottom: 8px;
            color: var(--muted-2);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .stat-card strong {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .overview-lead {
            padding: 28px;
            border-radius: var(--r-lg);
            background: color-mix(in oklab, var(--surface-2) 88%, transparent);
            border: 1px solid var(--border);
        }

        .overview-lead h4 {
            margin: 0 0 12px;
            font-size: 1.35rem;
        }

        .overview-lead p {
            margin: 0;
            color: var(--muted);
            line-height: 1.9;
        }

        .overview-lead .pill-row {
            margin-top: 18px;
        }

        .overview-pills .pill {
            color: var(--fg);
            background: color-mix(in oklab, var(--surface) 82%, transparent);
        }

        .overview-visual {
            overflow: hidden;
            border-radius: var(--r-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lift);
            background: color-mix(in oklab, var(--surface-2) 90%, transparent);
            margin-top: 24px;
        }

        .overview-visual img {
            width: 100%;
            height: auto;
            min-height: 0;
            object-fit: contain;
        }

        .overview-lead h4 {
            line-height: 1.35;
        }

        .overview-lead p + p {
            margin-top: 12px;
        }

        .split-visual img {
            width: 100%;
            border-radius: var(--r-lg);
            border: 1px solid var(--border);
        }

        .caption {
            margin-top: 10px;
            color: var(--muted);
            line-height: 1.7;
            font-size: 0.94rem;
        }

        .day-block {
            margin-top: 42px;
        }

        .day-header {
            padding: 30px;
        }

        .day-header-grid {
            display: grid;
            grid-template-columns: 160px minmax(0, 1fr);
            gap: 22px;
            align-items: center;
        }

        .day-numeral {
            font-size: clamp(5rem, 10vw, 8rem);
            font-weight: 800;
            line-height: 0.85;
            letter-spacing: -0.06em;
            color: var(--accent-2);
        }

        .day-header h3 {
            margin: 12px 0 8px;
            font-size: 2.1rem;
        }

        .day-header p {
            margin: 0;
            color: var(--muted);
            line-height: 1.8;
        }

        .unit-card {
            margin-top: 20px;
            padding: 28px 30px 32px;
        }

        .unit-top {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            align-items: start;
        }

        .unit-kicker {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent-deep);
            font-weight: 700;
            font-size: 0.92rem;
        }

        .unit-title {
            margin: 16px 0 12px;
            font-size: 2rem;
            line-height: 1.15;
        }

        .unit-summary {
            margin: 0;
            color: var(--muted);
            line-height: 1.9;
            font-size: 1.02rem;
            max-width: 840px;
        }

        .goal-list,
        .appendix-list {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }

        .goal-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 14px 16px;
            border-radius: var(--r-md);
            background: color-mix(in oklab, var(--surface-2) 90%, transparent);
            border: 1px solid var(--border);
        }

        .goal-item::before {
            content: '✓';
            display: inline-flex;
            width: 22px;
            height: 22px;
            border-radius: 999px;
            align-items: center;
            justify-content: center;
            background: var(--success-soft);
            color: var(--success);
            font-weight: 800;
            flex: 0 0 auto;
            margin-top: 1px;
        }

        .unit-hero-frame {
            overflow: hidden;
            border-radius: var(--r-lg);
            background: color-mix(in oklab, var(--surface-2) 88%, transparent);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lift);
        }

        .unit-hero-frame img {
            width: 100%;
            height: auto;
            min-height: 0;
            max-height: none;
            object-fit: contain;
        }

        .unit-visual .caption {
            margin-top: 12px;
            max-width: 860px;
        }

        .unit-copy {
            display: grid;
            gap: 18px;
        }

        .unit-hero-band {
            margin: 8px 0 6px;
        }

        .unit-hero-band .caption {
            padding-left: 2px;
        }

        .accordion {
            margin-top: 24px;
            display: grid;
            gap: 16px;
        }

        .accordion-item {
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            background: color-mix(in oklab, var(--surface) 90%, transparent);
            overflow: hidden;
        }

        .accordion-item[open] {
            box-shadow: var(--shadow-lift);
        }

        .accordion-item.is-verification {
            border-color: color-mix(in oklab, var(--accent) 30%, var(--border));
            background: color-mix(in oklab, var(--accent-soft) 28%, var(--surface));
        }

        .accordion-item.is-warning {
            border-color: color-mix(in oklab, var(--warning) 34%, var(--border));
            background: color-mix(in oklab, var(--warning-soft) 44%, var(--surface));
        }

        .accordion-summary {
            list-style: none;
            cursor: pointer;
            padding: 20px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            font-weight: 700;
            font-size: 1.08rem;
        }

        .accordion-summary-title {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .accordion-summary::-webkit-details-marker {
            display: none;
        }

        .accordion-summary::after {
            content: '+';
            font-size: 1.4rem;
            color: var(--accent-deep);
            transition: transform 160ms ease;
        }

        .accordion-item[open] .accordion-summary::after {
            transform: rotate(45deg);
        }

        .section-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 24px;
            padding: 0 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        .section-badge.verification {
            background: color-mix(in oklab, var(--accent) 18%, white);
            color: var(--accent-deep);
        }

        .section-badge.warning {
            background: color-mix(in oklab, var(--warning) 22%, white);
            color: oklch(42% 0.12 70);
        }

        .accordion-body {
            padding: 0 22px 22px;
        }

        .content-stack {
            display: grid;
            gap: 18px;
        }

        .content-stack p {
            margin: 0;
            color: var(--muted);
            line-height: 1.95;
            font-size: 1rem;
        }

        .content-stack ul {
            margin: 0;
            padding-left: 18px;
            color: var(--muted);
            line-height: 1.9;
        }

        .callout {
            padding: 16px 18px;
            border-radius: var(--r-md);
            border: 1px solid var(--border);
            background: color-mix(in oklab, var(--surface-2) 84%, transparent);
        }

        .callout.verification {
            border-color: color-mix(in oklab, var(--accent) 32%, var(--border));
            background: color-mix(in oklab, var(--accent-soft) 34%, var(--surface));
        }

        .callout.warning {
            border-color: color-mix(in oklab, var(--warning) 30%, var(--border));
            background: color-mix(in oklab, var(--warning-soft) 54%, var(--surface));
        }

        .callout strong {
            display: block;
            margin-bottom: 8px;
        }

        .inline-visual {
            margin-top: 6px;
        }

        .inline-visual img {
            width: 100%;
            border-radius: var(--r-lg);
            border: 1px solid var(--border);
        }

        .code-block {
            overflow: hidden;
            border-radius: var(--r-lg);
            background: var(--code-bg);
            border: 1px solid color-mix(in oklab, white 12%, transparent);
        }

        .code-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid color-mix(in oklab, white 12%, transparent);
            color: oklch(88% 0.01 250);
            font-size: 0.92rem;
        }

        .code-head span:last-child {
            color: oklch(76% 0.01 250);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .code-block pre {
            margin: 0;
            padding: 18px 20px;
            overflow-x: auto;
            color: var(--code-fg);
            font-size: 0.94rem;
            line-height: 1.75;
        }

        .task-panel {
            margin-top: 24px;
            padding: 22px;
            border-radius: var(--r-lg);
            background: color-mix(in oklab, var(--surface-2) 88%, transparent);
            border: 1px solid var(--border);
        }

        .task-panel h4 {
            margin: 0 0 14px;
            font-size: 1.08rem;
        }

        .task-list {
            display: grid;
            gap: 10px;
        }

        .task-item {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px 14px;
            border-radius: var(--r-sm);
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .task-item.done {
            background: var(--success-soft);
            border-color: color-mix(in oklab, var(--success) 35%, var(--border));
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--success);
            flex: 0 0 auto;
        }

        .task-label {
            line-height: 1.7;
        }

        .task-item.done .task-label {
            color: var(--muted);
            text-decoration: line-through;
        }

        .footer-note {
            margin-top: 18px;
            padding: 16px 18px;
            border-radius: var(--r-md);
            border: 1px dashed var(--border-strong);
            background: color-mix(in oklab, var(--surface-2) 88%, transparent);
            color: var(--muted);
            line-height: 1.8;
        }

        .footer-note code {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 8px;
            border-radius: 8px;
            background: color-mix(in oklab, var(--surface) 78%, transparent);
            color: var(--fg);
        }

        .site-footer {
            margin-top: 34px;
            padding: 0 24px;
            text-align: center;
            color: var(--muted);
            line-height: 1.8;
        }

        @media (max-width: 1180px) {
            .shell {
                margin-left: 0;
            }

            /* 小螢幕：sidebar 預設隱藏，改為 overlay 浮層 */
            .sidebar {
                display: none;
            }

            body.sidebar-visible-mobile .sidebar {
                display: block;
            }
        }

        @media (max-width: 980px) {
            .hero-overlay,
            .stat-grid,
            .summary-grid,
            .faq-grid,
            .day-header-grid {
                grid-template-columns: 1fr;
            }

            .hero {
                min-height: auto;
            }

            .hero-overlay {
                min-height: auto;
                padding: 34px 24px 28px;
            }
        }

        @media (max-width: 640px) {
            .content,
            .hero-band {
                padding-left: 16px;
                padding-right: 16px;
            }

            .top-actions {
                top: 12px;
                right: 16px;
            }

            .section,
            .unit-card,
            .day-header {
                padding-left: 20px;
                padding-right: 20px;
            }

            .hero {
                border-radius: 0 0 24px 24px;
            }

            .hero-copy h2 {
                font-size: clamp(2.2rem, 10vw, 3rem);
            }
        }
    </style>
</head>
<body>
<button id="sidebar-restore" class="sidebar-restore-btn" type="button">☰ 選單</button>
<div class="top-actions">
    <button id="theme-toggle" class="top-theme-toggle" type="button">切換深色模式</button>
</div>
<div class="shell">
    <aside class="sidebar">
        <button id="sidebar-close" class="sidebar-close-btn" type="button" title="收起選單">✕</button>
        <div class="brand">
            <small>Teaching Site</small>
            <h1 id="sidebar-title">課程載入中</h1>
            <p id="sidebar-summary">正在初始化課程資料與章節導覽。</p>
        </div>
        <nav id="sidebar-nav" aria-label="課程章節導覽"></nav>
        <div class="sidebar-tools">
            <a id="demo-link" class="tool-button" href="http://localhost:8080/">開啟成果 Demo</a>
            <button id="reset-progress" class="tool-button" type="button">清除學習進度</button>
        </div>
    </aside>

    <main class="main">
        <div id="hero-root"></div>
        <div class="content" id="app"></div>
    </main>
</div>

<script>
    const STORAGE_KEY = 'learn-spring-teaching-site-state';

    /** 建立 DOM 節點，降低版面渲染樣板重複。 */
    function createElement(tag, options = {}, children = []) {
        const node = document.createElement(tag);
        const { className, text, html, attrs } = options;

        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        if (html !== undefined) node.innerHTML = html;
        if (attrs) {
            Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        }

        children.filter(Boolean).forEach((child) => {
            if (typeof child === 'string') {
                node.appendChild(document.createTextNode(child));
            } else {
                node.appendChild(child);
            }
        });
        return node;
    }

    /** 讀取本機狀態，集中管理主題與學習進度。 */
    function loadState() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : { theme: 'light', tasks: {} };
        } catch (error) {
            return { theme: 'light', tasks: {} };
        }
    }

    /** 寫回 localStorage。 */
    function saveState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    /** 套用主題。 */
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('theme-toggle').textContent = theme === 'dark' ? '切換淺色模式' : '切換深色模式';
    }

    /** 切換側邊選單顯示／隱藏，並持久化狀態。 */
    function toggleSidebar(hidden) {
        document.body.classList.toggle('sidebar-hidden', hidden);
        const state = loadState();
        state.sidebarHidden = hidden;
        saveState(state);
    }

    /** 切換深淺色模式。 */
    function toggleTheme() {
        const state = loadState();
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        saveState(state);
        applyTheme(state.theme);
    }

    /** 更新單一任務完成狀態。 */
    function toggleTask(taskId, checked) {
        const state = loadState();
        state.tasks[taskId] = checked;
        saveState(state);
        const row = document.querySelector(`[data-task-id="${taskId}"]`);
        if (row) row.classList.toggle('done', checked);
    }

    /** 清空所有任務勾選。 */
    function resetProgress() {
        const state = loadState();
        state.tasks = {};
        saveState(state);
        document.querySelectorAll('.task-item').forEach((item) => item.classList.remove('done'));
        document.querySelectorAll('.task-checkbox').forEach((checkbox) => {
            checkbox.checked = false;
        });
    }

    /** 建立全幅 Hero。 */
    function renderHero(meta) {
        const pills = meta.techStack.map((item) => createElement('span', { className: 'pill', text: item }));
        const stats = createElement('ul', {}, meta.outcomes.map((item) => createElement('li', { text: item })));

        return createElement('div', { className: 'hero-band' }, [
            createElement('section', { className: 'hero', attrs: { id: 'top' } }, [
                createElement('div', { className: 'hero-media' }, [
                    createElement('img', {
                        attrs: {
                            src: meta.heroImage,
                            alt: 'Spring Boot 與 Spring AI 兩天實戰課程全幅主視覺'
                        }
                    })
                ]),
                createElement('div', { className: 'hero-overlay' }, [
                    createElement('div', { className: 'hero-copy' }, [
                        createElement('span', { className: 'eyebrow', text: '兩天完成智慧商城客服系統' }),
                        createElement('h2', { text: meta.title }),
                        createElement('p', { text: meta.subtitle }),
                        createElement('div', { className: 'pill-row' }, pills),
                        createElement('div', { className: 'hero-actions' }, [
                            createElement('a', { className: 'primary-button', text: '開始閱讀課程', attrs: { href: '#overview' } }),
                            createElement('a', { className: 'secondary-button', text: '開啟成果 Demo', attrs: { href: meta.demoUrl, target: '_blank', rel: 'noreferrer' } })
                        ])
                    ]),
                    createElement('aside', { className: 'hero-panel' }, [
                        createElement('h3', { text: '完成後你會得到' }),
                        stats
                    ])
                ])
            ])
        ]);
    }

    /** 建立總覽區塊。 */
    function renderOverview(course) {
        const meta = course.meta;
        const overview = course.overview;
        const stackPills = meta.techStack.slice(0, 6).map((item) => createElement('span', { className: 'pill', text: item }));

        return createElement('section', { className: 'section glass-card', attrs: { id: 'overview' } }, [
            createElement('div', { className: 'section-header' }, [
                createElement('div', {}, [
                    createElement('h3', { text: '課程總覽' }),
                    createElement('p', { text: '這門課不是把 8 章排成清單而已，而是用工程主線把每一章的責任邊界與驗證方式串起來。' })
                ])
            ]),
            createElement('div', { className: 'overview-lead' }, [
                createElement('h4', { text: '兩天的課程主線不是技術堆疊清單，而是一條完整的系統建置路徑。' }),
                createElement('p', { text: 'Day 1 先把 Spring Boot、REST、資料庫容器化與 JPA 的工程底盤搭穩；Day 2 再把對話模型、工具呼叫與知識檢索接回同一個應用。總覽區應該先讓學員看到這條主線，而不是立刻掉進細節卡片。' }),
                createElement('p', { text: '因此首頁總覽的目標不是「列出資訊」，而是先把課程的節奏、成果與學習順序建立成一個有記憶點的入口。' }),
                createElement('div', { className: 'pill-row overview-pills' }, stackPills)
            ]),
            createElement('div', { className: 'overview-visual' }, [
                createElement('img', {
                    attrs: {
                        src: meta.overviewImage,
                        alt: '兩天課程總覽主視覺圖'
                    }
                }),
                createElement('div', { className: 'caption', text: '課程總覽圖單獨呈現兩天學習路徑，不再與旁邊文字爭奪視線。' })
            ]),
            createElement('div', { className: 'stat-grid' }, overview.pillars.map((item) =>
                createElement('article', { className: 'stat-card' }, [
                    createElement('small', { text: item.label }),
                    createElement('strong', { text: item.value }),
                    createElement('p', { text: item.detail })
                ])
            )),
            createElement('article', { className: 'summary-card', attrs: { style: 'margin-top: 24px;' } }, [
                createElement('small', { text: '課前準備' }),
                createElement('h4', { text: `適合對象：${meta.audience}` }),
                createElement('ul', {}, meta.prerequisites.map((item) => createElement('li', { text: item })))
            ])
        ]);
    }

    /** 建立任務清單。 */
    function renderTaskList(tasks) {
        const state = loadState();
        return createElement('div', { className: 'task-list' }, tasks.map((task) => {
            const checked = !!state.tasks[task.id];
            const checkbox = createElement('input', { className: 'task-checkbox', attrs: { type: 'checkbox' } });
            checkbox.checked = checked;
            checkbox.addEventListener('change', (event) => toggleTask(task.id, event.target.checked));

            return createElement('label', {
                className: `task-item${checked ? ' done' : ''}`,
                attrs: { 'data-task-id': task.id }
            }, [
                checkbox,
                createElement('span', { className: 'task-label', text: task.text })
            ]);
        }));
    }

    /** 建立程式碼區塊。 */
    function renderCodeBlock(code) {
        return createElement('div', { className: 'code-block' }, [
            createElement('div', { className: 'code-head' }, [
                createElement('span', { text: code.title }),
                createElement('span', { text: code.language })
            ]),
            createElement('pre', {}, [
                createElement('code', { text: code.content })
            ])
        ]);
    }

    /** 判斷段落屬性，提供驗證與常見錯誤專用樣式。 */
    function getSectionVariant(section) {
        if (section.type === 'warning' || section.title.includes('常見錯誤')) {
            return 'warning';
        }
        if (section.title.includes('驗證') || section.title.includes('判讀') || section.title.includes('成果驗證')) {
            return 'verification';
        }
        return '';
    }

    /** 建立單一章節段落內容。 */
    function renderSectionBlock(section) {
        const variant = getSectionVariant(section);
        const stack = createElement('div', { className: 'content-stack' });

        (section.paragraphs || []).forEach((item) => {
            stack.appendChild(createElement('p', { text: item }));
        });

        if (variant === 'verification') {
            stack.insertBefore(createElement('div', { className: 'callout verification' }, [
                createElement('strong', { text: '驗證重點' }),
                createElement('p', { text: '請比對最低需求、操作指令、實際輸出與判讀條件，不要只看指令有沒有執行。' })
            ]), stack.firstChild);
        }

        if (variant === 'warning') {
            stack.insertBefore(createElement('div', { className: 'callout warning' }, [
                createElement('strong', { text: '排查重點' }),
                createElement('p', { text: '這一段列的是最容易卡住的地方。若結果不符預期，優先對照這些症狀再往下查。' })
            ]), stack.firstChild);
        }

        if (section.bullets && section.bullets.length) {
            stack.appendChild(createElement('ul', {}, section.bullets.map((item) => createElement('li', { text: item }))));
        }

        if (section.image) {
            stack.appendChild(createElement('div', { className: 'inline-visual' }, [
                createElement('img', {
                    attrs: {
                        src: section.image,
                        alt: section.imageAlt || section.title
                    }
                }),
                section.imageCaption ? createElement('div', { className: 'caption', text: section.imageCaption }) : null
            ]));
        }

        if (section.code) {
            stack.appendChild(renderCodeBlock(section.code));
        }

        return createElement('details', {
            className: `accordion-item${variant ? ` is-${variant}` : ''}`,
            attrs: section.type === 'code' ? {} : { open: 'open' }
        }, [
            createElement('summary', { className: 'accordion-summary' }, [
                createElement('span', { className: 'accordion-summary-title' }, [
                    variant === 'verification' ? createElement('span', { className: 'section-badge verification', text: '驗證' }) : null,
                    variant === 'warning' ? createElement('span', { className: 'section-badge warning', text: '排查' }) : null,
                    createElement('span', { text: section.title })
                ])
            ]),
            createElement('div', { className: 'accordion-body' }, [stack])
        ]);
    }

    /** 建立單一章節卡片。 */
    function renderUnit(unit) {
        return createElement('article', { className: 'unit-card glass-card', attrs: { id: unit.id } }, [
            createElement('div', { className: 'unit-top' }, [
                createElement('div', { className: 'unit-copy' }, [
                    createElement('span', { className: 'unit-kicker', text: `Chapter ${unit.chapter}` }),
                    createElement('h4', { className: 'unit-title', text: unit.title }),
                    createElement('p', { className: 'unit-summary', text: unit.summary }),
                    createElement('div', { className: 'unit-visual unit-hero-band' }, [
                        createElement('div', { className: 'unit-hero-frame' }, [
                            createElement('img', {
                                attrs: {
                                    src: unit.heroImage,
                                    alt: `${unit.title} 主視覺`
                                }
                            })
                        ]),
                        createElement('div', { className: 'caption', text: `${unit.title} 的章節主視覺，作為本章入口。` })
                    ]),
                    createElement('div', { className: 'goal-list' }, unit.goals.map((goal) =>
                        createElement('div', { className: 'goal-item', text: goal })
                    ))
                ]),
            ]),
            createElement('div', { className: 'accordion' }, unit.sections.map(renderSectionBlock)),
            createElement('section', { className: 'task-panel' }, [
                createElement('h4', { text: '本章學習進度' }),
                renderTaskList(unit.tasks)
            ])
        ]);
    }

    /** 建立每日區塊。 */
    function renderDay(day) {
        return createElement('section', { className: 'day-block', attrs: { id: day.id } }, [
            createElement('div', { className: 'day-header glass-card' }, [
                createElement('div', { className: 'day-header-grid' }, [
                    createElement('div', { className: 'day-numeral', text: day.label.replace('Day ', 'D') }),
                    createElement('div', {}, [
                        createElement('span', { className: 'eyebrow', text: day.label }),
                        createElement('h3', { text: day.title }),
                        createElement('p', { text: day.lead })
                    ])
                ])
            ]),
            ...day.units.map(renderUnit)
        ]);
    }

    /** 建立附錄與 FAQ。 */
    function renderAppendix(appendix) {
        return createElement('section', { className: 'section glass-card', attrs: { id: 'appendix' } }, [
            createElement('div', { className: 'section-header' }, [
                createElement('div', {}, [
                    createElement('h3', { text: '附錄與驗證' }),
                    createElement('p', { text: '這一區保留教學文字統一原則、常見問題與實際專案啟動步驟，避免網站與程式碼範例脫節。' })
                ])
            ]),
            createElement('div', { className: 'summary-grid' }, [
                createElement('article', { className: 'summary-card' }, [
                    createElement('small', { text: '用語統一' }),
                    createElement('div', { className: 'appendix-list' }, appendix.terminology.map((item) =>
                        createElement('div', { className: 'goal-item', text: item })
                    ))
                ]),
                createElement('article', { className: 'summary-card' }, [
                    createElement('small', { text: '啟動流程' }),
                    renderCodeBlock({
                        language: 'powershell',
                        title: '本機驗證流程',
                        content: appendix.verification.join('\n')
                    })
                ])
            ]),
            createElement('div', { className: 'faq-grid' }, appendix.faq.map((item) =>
                createElement('article', { className: 'faq-card' }, [
                    createElement('strong', { text: item.q }),
                    createElement('p', { text: item.a })
                ])
            ))
        ]);
    }

    /** 清空一個 DOM 節點的所有子節點。 */
    function clearChildren(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
    }

    /** 建立側邊導覽（Day 群組可收折，狀態存 localStorage）。 */
    function renderSidebar(course) {
        document.getElementById('sidebar-title').textContent = course.meta.title;
        document.getElementById('sidebar-summary').textContent = course.meta.subtitle;
        document.getElementById('demo-link').setAttribute('href', course.meta.demoUrl);

        const state = loadState();
        const nav = document.getElementById('sidebar-nav');
        clearChildren(nav);

        nav.appendChild(createElement('a', {
            className: 'nav-link',
            attrs: { href: '#overview', 'data-target': 'overview' }
        }, [
            createElement('strong', { text: '課程總覽' }),
            createElement('span', { text: '定位與準備' })
        ]));

        course.days.forEach((day) => {
            const isOpen = (state.navGroups?.[day.id]) !== false;
            const body = createElement('div', { className: 'nav-group-body' },
                day.units.map((unit) =>
                    createElement('a', {
                        className: 'nav-chapter-link',
                        attrs: { href: `#${unit.id}`, 'data-target': unit.id }
                    }, [
                        createElement('span', { className: 'nav-chapter-num', text: unit.chapter }),
                        createElement('span', { className: 'nav-chapter-title', text: unit.title })
                    ])
                )
            );
            const details = createElement('details', { className: 'nav-group' }, [
                createElement('summary', { className: 'nav-group-header' }, [
                    createElement('span', { className: 'nav-group-badge', text: day.label }),
                    createElement('span', { className: 'nav-group-title', text: day.title })
                ]),
                body
            ]);
            if (isOpen) details.setAttribute('open', '');
            details.addEventListener('toggle', () => {
                const s = loadState();
                if (!s.navGroups) s.navGroups = {};
                s.navGroups[day.id] = details.open;
                saveState(s);
            });
            nav.appendChild(details);
        });

        nav.appendChild(createElement('a', {
            className: 'nav-link',
            attrs: { href: '#appendix', 'data-target': 'appendix' }
        }, [
            createElement('strong', { text: '附錄與驗證' }),
            createElement('span', { text: 'FAQ / 啟動' })
        ]));
    }

    /** 設定側邊欄滾動高亮（同時支援 Day 層連結與章節連結）。 */
    function setupScrollSpy() {
        const links = Array.from(document.querySelectorAll('.nav-link, .nav-chapter-link'));
        const sections = links.map((link) => document.getElementById(link.getAttribute('data-target'))).filter(Boolean);
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (!entry.isIntersecting) return;
                const activeId = entry.target.id;
                links.forEach((link) => {
                    link.classList.toggle('active', link.getAttribute('data-target') === activeId);
                });
            });
        }, { rootMargin: '-20% 0px -60% 0px', threshold: 0.08 });

        sections.forEach((section) => observer.observe(section));
    }

    /** 主程式入口。 */
    function init() {
        const course = window.COURSE;
        const state = loadState();
        const app = document.getElementById('app');
        const heroRoot = document.getElementById('hero-root');

        applyTheme(state.theme || 'light');
        if (state.sidebarHidden) document.body.classList.add('sidebar-hidden');
        renderSidebar(course);

        heroRoot.appendChild(renderHero(course.meta));
        app.appendChild(renderOverview(course));
        course.days.forEach((day) => app.appendChild(renderDay(day)));
        app.appendChild(renderAppendix(course.appendix));
        app.appendChild(createElement('footer', {
            className: 'site-footer',
            html: '教學網站已改為寬版長文結構，章節內容以可收折段落、程式碼區塊與插畫對位方式呈現。'
        }));

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        document.getElementById('reset-progress').addEventListener('click', resetProgress);
        document.getElementById('sidebar-close').addEventListener('click', () => toggleSidebar(true));
        document.getElementById('sidebar-restore').addEventListener('click', () => toggleSidebar(false));
        setupScrollSpy();
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
